<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232733"/>
      <stop offset="1" stop-color="#0e1014"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d39a"/>
      <stop offset="1" stop-color="#c9963f"/>
    </linearGradient>
    <linearGradient id="lut" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3b6fd8"/>
      <stop offset="0.5" stop-color="#e5b96f"/>
      <stop offset="1" stop-color="#e06464"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#3a3f4f" stroke-width="6"/>
  <!-- film frame -->
  <rect x="232" y="248" width="560" height="528" rx="64" fill="none" stroke="url(#gold)" stroke-width="44"/>
  <g fill="url(#gold)">
    <rect x="232" y="352" width="96" height="28" rx="10"/>
    <rect x="232" y="498" width="96" height="28" rx="10"/>
    <rect x="232" y="644" width="96" height="28" rx="10"/>
    <rect x="696" y="352" width="96" height="28" rx="10"/>
    <rect x="696" y="498" width="96" height="28" rx="10"/>
    <rect x="696" y="644" width="96" height="28" rx="10"/>
    <rect x="328" y="248" width="24" height="528"/>
    <rect x="672" y="248" width="24" height="528"/>
  </g>
  <!-- LUT transfer curve -->
  <path d="M384 690 C 450 690, 470 560, 512 512 S 590 336, 640 334" fill="none" stroke="url(#lut)" stroke-width="30" stroke-linecap="round"/>
</svg>
